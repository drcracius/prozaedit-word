name: Version sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest and task pane version
        run: bash scripts/verify-version-sync.sh

  pure-js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run pure JS unit tests (no Office.js)
        run: npm test
