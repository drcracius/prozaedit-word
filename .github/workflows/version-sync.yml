name: Version sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify manifest and task pane version
        run: bash scripts/verify-version-sync.sh

  pure-js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dev dependencies (jsdom for the task pane harness)
        run: npm ci
      - name: Wiring gate (orphan ids, duplicate ids, undefined inline handlers, missing assets)
        run: node scripts/verify-wiring.mjs
      - name: Run unit and jsdom harness tests (mocked Office.js)
        run: npm test
